<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">
    <nav class="d-flex justify-content-between align-items-center px-4 py-3 bg-opacity-95 border-bottom position-fixed top-0 start-0 end-0 z-3">
        <div class="nav-links d-flex gap-3">
            <a href="index.html">Home</a>
            <a href="calculadora.html" class="active">Calculadora</a>
        </div>
        <button id="theme-toggle" class="theme-toggle btn btn-outline-secondary d-flex align-items-center justify-content-center rounded-3 p-2" aria-label="Toggle light/dark mode">
            <ion-icon name="sunny" class="sun-icon"></ion-icon>
            <ion-icon name="moon" class="moon-icon"></ion-icon>
        </button>
    </nav>
    <main class="container pt-5">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card shadow-lg rounded-4">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">
                            <ion-icon name="calculator-outline" style="font-size:2rem;vertical-align:middle;"></ion-icon>
                            Calculadora
                        </h2>
                        <form id="calc-form" class="mb-3">
                            <div class="mb-3">
                                <label for="operacao" class="form-label">Operação</label>
                                <select id="operacao" class="form-select">
                                    <option value="soma">Somar (+)</option>
                                    <option value="subtrai">Subtrair (-)</option>
                                    <option value="multiplica">Multiplicar (×)</option>
                                    <option value="divide">Dividir (÷)</option>
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-12 col-md-6 mb-3 mb-md-0">
                                    <label for="num1" class="form-label">Número 1</label>
                                    <input type="number" id="num1" class="form-control" required placeholder="Digite o primeiro número">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="num2" class="form-label">Número 2</label>
                                    <input type="number" id="num2" class="form-control" required placeholder="Digite o segundo número">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <ion-icon name="play-outline"></ion-icon>
                                Calcular
                            </button>
                        </form>
                        <div id="resultado" class="alert alert-info d-none text-center fw-bold"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
    <script>
      document.getElementById('calc-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const operacao = document.getElementById('operacao').value;
        const num1 = parseFloat(document.getElementById('num1').value);
        const num2 = parseFloat(document.getElementById('num2').value);
        let resultado;
        if (isNaN(num1) || isNaN(num2)) {
          resultado = "Os números devem ser válidos.";
        } else {
          switch (operacao) {
            case "soma":
              resultado = num1 + num2;
              break;
            case "subtrai":
              resultado = num1 - num2;
              break;
            case "multiplica":
              resultado = num1 * num2;
              break;
            case "divide":
              if (num2 === 0) {
                resultado = "Erro: divisão por zero.";
              } else {
                resultado = num1 / num2;
              }
              break;
            default:
              resultado = "Operação inválida.";
          }
        }
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.textContent = "Resultado: " + resultado;
        resultadoDiv.classList.remove('d-none');
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
