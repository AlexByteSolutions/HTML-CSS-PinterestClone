<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">
    <nav class="d-flex justify-content-between align-items-center px-4 py-3 bg-opacity-95 border-bottom position-fixed top-0 start-0 end-0 z-3">
        <div class="nav-links d-flex gap-3">
            <a href="index.html">Home</a>
            <a href="calculadora.html" class="active">Calculadora</a>
        </div>
        <button id="theme-toggle" class="theme-toggle btn btn-outline-secondary d-flex align-items-center justify-content-center rounded-3 p-2" aria-label="Toggle light/dark mode">
            <ion-icon name="sunny" class="sun-icon"></ion-icon>
            <ion-icon name="moon" class="moon-icon"></ion-icon>
        </button>
    </nav>
    <main class="container pt-5">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow-lg rounded-4">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">
                            <ion-icon name="calculator-outline" style="font-size:2rem;vertical-align:middle;"></ion-icon>
                            Calculadora
                        </h2>
                        <div class="mb-3">
                            <div id="calc-display" class="form-control text-end fs-3 fw-bold mb-2" style="height:60px; background:var(--surface);"></div>
                        </div>
                        <div class="row g-2">
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="7">7</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="8">8</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="9">9</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning w-100 py-3 btn-calc" data-value="/">÷</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="4">4</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="5">5</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="6">6</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning w-100 py-3 btn-calc" data-value="*">×</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="1">1</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="2">2</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="3">3</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning w-100 py-3 btn-calc" data-value="-">−</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-secondary w-100 py-3 btn-calc" data-value="C">C</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value="0">0</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-light w-100 py-3 btn-calc" data-value=".">.</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning w-100 py-3 btn-calc" data-value="+">+</button>
                            </div>
                            <div class="col-6 mt-2">
                                <button type="button" class="btn btn-danger w-100 py-3 btn-calc" data-value="DEL">DEL</button>
                            </div>
                            <div class="col-6 mt-2">
                                <button type="button" class="btn btn-success w-100 py-3 btn-calc" data-value="=">=</button>
                            </div>
                        </div>
                        <div id="resultado" class="alert alert-info d-none text-center fw-bold mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
    <script>
      // Calculadora lógica
      let calcDisplay = document.getElementById('calc-display');
      let resultadoDiv = document.getElementById('resultado');
      let current = '';
      let lastResult = '';

      function updateDisplay() {
        calcDisplay.textContent = current || '0';
      }

      function showResult(res) {
        resultadoDiv.textContent = "Resultado: " + res;
        resultadoDiv.classList.remove('d-none');
      }

      document.querySelectorAll('.btn-calc').forEach(btn => {
        btn.addEventListener('click', function() {
          const val = this.getAttribute('data-value');
          resultadoDiv.classList.add('d-none');
          if (val === 'C') {
            current = '';
            lastResult = '';
            updateDisplay();
          } else if (val === 'DEL') {
            current = current.slice(0, -1);
            updateDisplay();
          } else if (val === '=') {
            try {
              // Substitui símbolos para JS
              let expr = current.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
              let res = eval(expr);
              if (!isFinite(res)) {
                showResult("Erro: divisão por zero.");
              } else {
                showResult(res);
                lastResult = res;
                current = res.toString();
                updateDisplay();
              }
            } catch {
              showResult("Expressão inválida.");
            }
          } else {
            if (current.length < 20) {
              current += val;
              updateDisplay();
            }
          }
        });
      });

      updateDisplay();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
