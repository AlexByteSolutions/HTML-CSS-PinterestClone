<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Calculadora</h1>
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="mb-3">
                    <input type="number" id="num1" class="form-control" placeholder="Digite o primeiro número">
                </div>
                <div class="mb-3">
                    <input type="number" id="num2" class="form-control" placeholder="Digite o segundo número">
                </div>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-primary" onclick="calculate('add')">Somar</button>
                    <button class="btn btn-secondary" onclick="calculate('subtract')">Subtrair</button>
                    <button class="btn btn-success" onclick="calculate('multiply')">Multiplicar</button>
                    <button class="btn btn-danger" onclick="calculate('divide')">Dividir</button>
                </div>
                <div class="mt-4">
                    <h4 class="text-center">Resultado: <span id="resultado">0</span></h4>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
